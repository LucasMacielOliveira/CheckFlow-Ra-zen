<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>CheckFlow - Auditoria</title>

  <link rel="stylesheet" href="../CSS/style.css" />
</head>

<body>
  <div id="toastContainer" class="toast-container"></div>

  <div class="page">
    <div class="card admin-card">

      <div class="logo">
        <img src="../assets/checkflow-logo.png" alt="CheckFlow">
      </div>

      <div class="history-header">
        <div class="subtitle no-margin">
          Auditoria do Sistema
        </div>

        <p class="history-description">
          Consulte os registros das principais ações realizadas pelos usuários no CheckFlow.
        </p>
      </div>

      <div class="history-actions">
        <button
          class="secondary-button small-button"
          type="button"
          onclick="window.location.href='admin.html'"
        >
          Voltar
        </button>

        <button
          class="history-nav-button small-button"
          type="button"
          onclick="carregarAuditoria()"
        >
          Atualizar
        </button>
      </div>

      <section class="dashboard-grid">
        <div class="dashboard-card">
          <span class="dashboard-label">Total de logs</span>
          <strong id="totalLogsAuditoria">0</strong>
        </div>

        <div class="dashboard-card">
          <span class="dashboard-label">Última ação</span>
          <strong id="ultimaAcaoAuditoria">-</strong>
        </div>

        <div class="dashboard-card">
          <span class="dashboard-label">Último usuário</span>
          <strong id="ultimoUsuarioAuditoria">-</strong>
        </div>

        <div class="dashboard-card">
          <span class="dashboard-label">Módulo</span>
          <strong id="ultimaEntidadeAuditoria">-</strong>
        </div>
      </section>

      <div id="loadingAuditoria" class="loading-state" style="display: none;">
        <div class="loading-spinner"></div>
        <span>Carregando auditoria...</span>
      </div>

      <section class="dashboard-section">
        <div class="dashboard-filters">
  <div class="filter-group">
    <label for="filtroUsuarioAuditoria">Usuário</label>
    <input
      id="filtroUsuarioAuditoria"
      class="input"
      type="text"
      placeholder="Ex.: Lucas"
    >
  </div>

  <div class="filter-group">
    <label for="filtroAcaoAuditoria">Ação</label>
    <select id="filtroAcaoAuditoria" class="input">
      <option value="">Todas</option>
      <option value="LOGIN">LOGIN</option>
      <option value="FINALIZOU_CHECKLIST">FINALIZOU_CHECKLIST</option>
      <option value="CRIAR_USUARIO">CRIAR_USUARIO</option>
      <option value="EDITAR_USUARIO">EDITAR_USUARIO</option>
      <option value="ATIVAR_USUARIO">ATIVAR_USUARIO</option>
      <option value="DESATIVAR_USUARIO">DESATIVAR_USUARIO</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="filtroDataInicioAuditoria">Data inicial</label>
    <input id="filtroDataInicioAuditoria" class="input" type="date">
  </div>

  <div class="filter-group">
    <label for="filtroDataFimAuditoria">Data final</label>
    <input id="filtroDataFimAuditoria" class="input" type="date">
  </div>

  <div class="filter-actions">
    <button class="button small-button" type="button" onclick="aplicarFiltrosAuditoria()">
      Aplicar
    </button>

    <button class="secondary-button small-button" type="button" onclick="limparFiltrosAuditoria()">
      Limpar
    </button>
  </div>
</div>
        
<div class="admin-list-header">
          <h3 class="selection-title">Logs de auditoria</h3>

          <span class="status-badge success">
            Rastreamento ativo
          </span>
        </div>

        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Data</th>
                <th>Usuário</th>
                <th>Ação</th>
                <th>Entidade</th>
                <th>Detalhes</th>
              </tr>
            </thead>

            <tbody id="auditoriaTabela">
              <tr>
                <td colspan="5">Carregando logs...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <div class="footer-brand">
        <img src="../assets/raizen-logo.png" alt="Raízen">
      </div>

    </div>
  </div>

  <script src="../JS/storage.js"></script>
  <script src="../JS/auth.js"></script>
  <script src="../JS/api.js"></script>
  <script src="../JS/admin-auditoria.js"></script>
</body>

</html>
